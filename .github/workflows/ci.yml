name: Godot foundation
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GODOT_VERSION: 4.5.2
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Godot and export templates
        shell: bash
        run: |
          base="https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable"
          curl --fail --location --retry 3 "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip" -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          sudo install -m 755 "/tmp/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64" /usr/local/bin/godot
          curl --fail --location --retry 3 "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz" -o /tmp/templates.zip
          unzip -q /tmp/templates.zip -d /tmp/godot-templates
          mkdir -p "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          cp -r /tmp/godot-templates/templates/. "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable/"
      - name: Import and test both entry paths
        run: |
          godot --headless --path . --editor --import
          godot --headless --path . --script tests/smoke.gd
          godot --headless --path . --script tests/smoke.gd -- --server
      - name: Export browser and dedicated server
        run: |
          mkdir -p build/web build/server
          godot --headless --path . --export-release Web
          godot --headless --path . --export-release 'Linux Server'
          build/server/fight-game.x86_64 --headless --quit-after 3
      - uses: actions/upload-artifact@v4
        with:
          name: fight-game-phase-1
          path: build/
